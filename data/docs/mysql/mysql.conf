# For advice on how to change settings please see
# http://dev.mysql.com/doc/refman/8.0/en/server-configuration-defaults.html

[mysqld@prod]
datadir=/var/lib/mysql
socket=/var/lib/mysql/mysql.sock
log-error=/var/log/mysqld.log
pid-file=/var/run/mysqld/mysqld.pid
bind-address = 0.0.0.0
port=3306

# test
[mysqld@test]
datadir=/var/lib/mysql-test
socket=/var/lib/mysql-test/mysql.sock
log-error=/var/log/mysqld-test.log
pid-file=/var/run/mysqld/mysqld-test.pid
bind-address=0.0.0.0
port=3307

# demo
[mysqld@demo]
datadir=/var/lib/mysql-demo
socket=/var/lib/mysql-demo/mysql.sock
log-error=/var/log/mysqld-demo.log
pid-file=/var/run/mysqld/mysqld-demo.pid
bind-address=0.0.0.0
port=3308

[mysqldump]
user=root
password=---------------------------
